[project]
name = "pygm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Piawanegawa", email = "96909944+Piawanegawa@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=25.12.0",
    "coverage>=7.13.0",
    "dotenv>=0.9.9",
    "openai>=2.12.0",
    "pydantic>=2.12.5",
    "rich>=14.2.0",
    "typer>=0.20.0",
]

[project.scripts]
pygm = "pygm:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.14.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = ["src"]
